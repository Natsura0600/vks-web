<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>VKS — Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<section id="login" class="login"><form id="lf" novalidate><h1>VKS <small>ADMIN</small></h1>
<label>usuario<input id="u" autocomplete="username"></label><label>contraseña<input id="pw" type="password" autocomplete="current-password"></label>
<button class="btn">ingresar</button><p id="lerr" role="alert"></p><p class="note" id="lnote"></p></form></section>
<div id="app" hidden><aside class="side"><b class="lg">VKS <small>ADMIN</small></b>
<nav><button data-v="dash" class="on">resumen</button><button data-v="obras">obras</button><button data-v="media">media</button></nav>
<div class="sf"><a href="/index.html" target="_blank">ver sitio ↗</a><button id="out">salir</button></div></aside>
<main>
<section data-s="dash"><h2>resumen</h2><div class="stats" id="stats"></div><p class="note" id="mode"></p></section>
<section data-s="obras" hidden><div class="tb"><h2>obras</h2><input id="q" placeholder="buscar obra…" aria-label="Buscar"><div class="chips"><button class="on" data-c="all">todas</button><button data-c="feat">destacadas</button><button data-c="draft">borradores</button></div><button class="btn" id="new">+ nueva obra</button></div><div id="list" class="list"></div></section>
<section data-s="media" hidden><h2>media</h2><div class="drop" id="mdrop" tabindex="0" role="button">arrastrá imágenes acá o <u>elegí archivos</u><input type="file" id="mfile" accept="image/*" multiple hidden></div>
<form id="mf"><input id="murl" type="url" placeholder="o pegá una URL https://…" aria-label="URL"><button class="btn">agregar</button></form><div id="media" class="media"></div></section>
</main></div>
<div id="ov" class="ov" hidden></div>
<div id="dr" class="dr" aria-hidden="true"><form id="pf" novalidate><div class="dh"><h2 id="ft">nueva obra</h2><button type="button" id="cx" aria-label="Cerrar">✕</button></div><input type="hidden" id="id">
<fieldset><legend>01 · básico</legend><label>nombre<input id="title"></label><label>ubicación<input id="location"></label><div class="g2"><label>país<select id="country"><option>Argentina</option><option>Italia</option></select></label><label>año<input id="year" type="number" min="1900" max="2100"></label></div></fieldset>
<fieldset><legend>02 · detalle</legend><div class="g2"><label>categoría<select id="category"><option>residencial</option><option>comercial</option><option>institucional</option><option>interiorismo</option><option>otros</option></select></label><label>superficie<input id="area" placeholder="280 m²"></label></div><label>descripción<textarea id="description" rows="3"></textarea></label></fieldset>
<fieldset><legend>03 · imágenes</legend><label>imagen principal (URL)<input id="coverImage" type="url" placeholder="https://…"></label><img id="cprev" class="prev" alt="" hidden>
<div class="drop sm" id="cdrop" tabindex="0" role="button">subir imagen principal<input type="file" id="cfile" accept="image/*" hidden></div>
<label>galería<input id="gurl" placeholder="pegá URL y Enter"></label><div class="drop sm" id="gdrop" tabindex="0" role="button">subir imágenes a la galería<input type="file" id="gfile" accept="image/*" multiple hidden></div><div id="gth" class="gth"></div></fieldset>
<fieldset><legend>04 · publicación</legend><label>estado<select id="status"><option>publicada</option><option>borrador</option></select></label><label class="sw"><input id="featured" type="checkbox"><i></i>destacada en inicio (máx. 4)</label></fieldset>
<div class="df"><button class="btn" id="sv">guardar obra</button><button type="button" class="ghost" id="cn">cancelar</button></div></form></div>
<div id="toasts" aria-live="polite"></div>
<script src="/js/config.js"></script><script src="/js/store.js"></script><script src="/admin/admin.js"></script></body></html>
